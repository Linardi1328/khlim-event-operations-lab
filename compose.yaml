services:
  db:
    image: postgres:17-alpine
    ports:
      - "127.0.0.1:54329:5432"
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab_local_only
      POSTGRES_DB: khlim_lab
    volumes:
      - lab_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d khlim_lab"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  lab_postgres:
