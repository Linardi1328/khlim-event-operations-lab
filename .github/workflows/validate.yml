name: Validate lab
on:
  push:
    branches: [main, astra/initial-event-operations-build]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: lab-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: lab
          POSTGRES_PASSWORD: lab_local_only
          POSTGRES_DB: khlim_lab
        ports: ["54329:5432"]
        options: >-
          --health-cmd "pg_isready -U lab -d khlim_lab"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://lab:lab_local_only@127.0.0.1:54329/khlim_lab
      APP_ORIGIN: http://127.0.0.1:3000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm db:generate && pnpm db:migrate && pnpm db:seed
      - run: pnpm validate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-qa
          path: |
            playwright-report/
            test-results/
            docs/qa/*.png
          retention-days: 14
